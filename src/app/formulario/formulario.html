<div id="div-form">
    <h2>Cadastro de Clientes</h2>
    
    <form id="formulario">
        
        <label for="nome">Nome *</label>
        <input type="text" name="nome" id="nome" [(ngModel)]="nome" required placeholder="Digite seu nome completo">

       
        <label for="email">E-mail *</label>
        <input type="email" name="email" id="email" [(ngModel)]="email" required placeholder="exemplo@email.com">

       
        <label for="cpf">CPF *</label>
        <input type="text" name="cpf" id="cpf" [(ngModel)]="cpf" required placeholder="000.000.000-00">

        
        <label for="dataNascimento">Data de Nascimento *</label>
        <input type="date" name="dataNascimento" id="dataNascimento" [(ngModel)]="dataNascimento" required>

        
        <label for="uf">UF *</label>
        <select name="uf" id="uf" [(ngModel)]="uf" required>
            <option value="" disabled selected>Selecione a UF</option>
            <option value="SE">Sergipe (SE)</option>
            <option value="AL">Alagoas (AL)</option>
            <option value="BA">Bahia (BA)</option>
            <option value="SP">São Paulo (SP)</option>
            <option value="RJ">Rio de Janeiro (RJ)</option>
            
        </select>

       
        <label for="municipio">Município *</label>
        <input type="text" name="municipio" id="municipio" [(ngModel)]="municipio" required placeholder="Digite a cidade">

        
        <div id="div-btns">
            <button type="button" id="btnSalvar"(click)="save()"> Salvar </button>
            <button type="reset" id="btnLimpar" (click)="limparAtributos()"> Limpar </button> 
            
        </div>
    </form>

    
    
</div>
